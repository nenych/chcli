version: "2"

linters:
  default: standard
  enable:
    - bodyclose
    - errorlint
    - gosec
    - misspell
    - nilerr
    - noctx
    - unconvert
    - unparam
  settings:
    gosec:
      excludes:
        - G104 # unchecked errors are errcheck's job (see its exclusions below)
        - G204 # the pager command comes from the user's own configuration
        - G304 # reading files named by the user is what a CLI does
    staticcheck:
      checks: ["all", "-QF1001", "-ST1000"]
    errcheck:
      exclude-functions:
        - fmt.Fprint
        - fmt.Fprintf
        - fmt.Fprintln
        - (*bufio.Writer).Write
        - (*bufio.Writer).WriteString
        - (*bufio.Writer).WriteByte
        - (*os.File).Close
        - (io.Closer).Close
  exclusions:
    presets:
      - std-error-handling
    rules:
      - path: _test\.go
        linters:
          - errcheck
          - gosec
          - noctx
          - bodyclose

formatters:
  enable:
    - gofmt
    - goimports
  settings:
    goimports:
      local-prefixes:
        - github.com/nenych/chcli
