name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Check formatting
        run: test -z "$(gofmt -l cmd internal)" || (gofmt -l cmd internal; exit 1)
      - name: Check go.mod is tidy
        run: go mod tidy -diff
      - run: go vet -tags integration ./...
      - uses: golangci/golangci-lint-action@v8
        with:
          version: latest
      - name: Check the third-party notices
        run: scripts/third-party-notices.sh --check
      - name: Check dependency licences
        run: go run github.com/google/go-licenses@latest check ./cmd/chcli --disallowed_types=forbidden,restricted

  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go test -race ./...

  integration:
    runs-on: ubuntu-latest
    services:
      clickhouse:
        image: clickhouse/clickhouse-server:latest
        env:
          CLICKHOUSE_PASSWORD: chcli-test
        ports:
          - 9000:9000
          - 8123:8123
        options: >-
          --ulimit nofile=262144:262144
          --health-cmd "clickhouse-client --password chcli-test --query 'SELECT 1'"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      # Token (JWT) authentication is tested against Altinity Antalya, which
      # needs configuration files from the checkout and so cannot be a service.
      - name: Start Altinity Antalya with token authentication
        run: |
          make antalya-up
          for i in $(seq 1 60); do
            curl -sf http://127.0.0.1:18124/ping && break
            sleep 1
          done
      - run: go test -race -tags integration ./...
        env:
          CHCLI_TEST_ADDR: 127.0.0.1:9000
          CHCLI_TEST_HTTP_ADDR: 127.0.0.1:8123
          CHCLI_TEST_PASSWORD: chcli-test
          CHCLI_TEST_TOKEN_ADDR: 127.0.0.1:19001
          CHCLI_TEST_TOKEN_HTTP_ADDR: 127.0.0.1:18124

  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - {goos: linux, goarch: amd64}
          - {goos: linux, goarch: arm64}
          - {goos: darwin, goarch: amd64}
          - {goos: darwin, goarch: arm64}
          - {goos: windows, goarch: amd64}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Build
        run: go build -trimpath -o /tmp/chcli-${{ matrix.goos }}-${{ matrix.goarch }} ./cmd/chcli
        env:
          CGO_ENABLED: "0"
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
